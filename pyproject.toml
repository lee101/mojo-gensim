[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-gensim"
version = "0.1.0"
description = "Mojo kernels for a useful subset of gensim"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]
license = {text = "MIT"}

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
